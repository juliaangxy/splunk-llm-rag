AWSTemplateFormatVersion: '2010-09-09'
Description: GPU EC2 host with bootstrap to install Splunk AI stack.

Parameters:
  EnvironmentName:
    Type: String
  AmiId:
    Type: AWS::EC2::Image::Id
  InstanceType:
    Type: String
    Default: g6.4xlarge
    AllowedValues:
      - g6.4xlarge
      - g5.4xlarge
      - g4dn.4xlarge
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
  SubnetId:
    Type: AWS::EC2::Subnet::Id
  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  InstanceProfileName:
    Type: String
  RootVolumeSize:
    Type: Number
    Default: 80
  LicenseBucket:
    Type: String
  LicenseKey:
    Type: String
    Default: ''
  LicenseS3Prefix:
    Type: String
    Default: licenses/
  SplunkPackageUrl:
    Type: String
    Default: ''
  SplunkPackageS3Key:
    Type: String
    Default: ''
  SplunkPackageS3Prefix:
    Type: String
    Default: splunk-rpms/
  ContainerImageProfilesJson:
    Type: String
    Default: ''
  CfnArtifactBucket:
    Type: String
  BootstrapScriptsS3Key:
    Type: String
  BootstrapScriptsUrl:
    Type: String
  SplunkAdminUser:
    Type: String
    Default: admin
  SplunkAdminPassword:
    Type: String
    NoEcho: true
  SplunkMltkGpuImage:
    Type: String
    Default: ''
  SplunkLlmRagImage:
    Type: String
    Default: ''
  SplunkLlmRagHostPort:
    Type: Number
    Default: 5001
  SplunkMltkGpuHostPort:
    Type: Number
    Default: 5003
  MltkContainerExternalHost:
    Type: String
    Default: ''
  DsdlDockerHost:
    Type: String
    Default: tcp://127.0.0.1:2375
  DsdlEndpointUrl:
    Type: String
    Default: https://127.0.0.1:2375
  DsdlExternalUrl:
    Type: String
    Default: https://127.0.0.1:2375
  DsdlDockerNetwork:
    Type: String
    Default: dsenv-network
  DsdlCpuInferenceImage:
    Type: String
    Default: ''
  DsdlCpuInferencePort:
    Type: Number
    Default: 5002
  AiArtifactsBucket:
    Type: String
    Default: ''
  OllamaModelS3Prefix:
    Type: String
    Default: models/huggingface/ollama/
  OllamaModelsJson:
    Type: String
    Default: ''
  SplunkAppS3Keys:
    Type: String
    Default: ''
  SplunkAppsS3Prefix:
    Type: String
    Default: splunk-apps/
  RagModelName:
    Type: String
    Default: ''
  CreateSnapshotOnSuccess:
    Type: String
    Default: 'true'
  RequireBootstrapSuccess:
    Type: String
    Default: 'true'
  SkipSplunkAppsBootstrap:
    Type: String
    Default: 'false'

Resources:
  SplunkAiInstance:
    Type: AWS::EC2::Instance
    CreationPolicy:
      ResourceSignal:
        Count: 1
        Timeout: PT90M
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      IamInstanceProfile: !Ref InstanceProfileName
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !Ref SecurityGroupId
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeType: gp3
            VolumeSize: !Ref RootVolumeSize
            DeleteOnTermination: true
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          exec > >(tee -a /var/log/splunk-ai-userdata.log) 2>&1

          export LICENSE_BUCKET='${LicenseBucket}'
          export LICENSE_KEY='${LicenseKey}'
          export LICENSES_S3_PREFIX='${LicenseS3Prefix}'
          export SPLUNK_PACKAGE_URL='${SplunkPackageUrl}'
          export SPLUNK_PACKAGE_S3_KEY='${SplunkPackageS3Key}'
          export SPLUNK_PACKAGE_S3_PREFIX='${SplunkPackageS3Prefix}'
          export CONTAINER_IMAGE_PROFILES_JSON='${ContainerImageProfilesJson}'
          export CFN_ARTIFACT_BUCKET='${CfnArtifactBucket}'
          export BOOTSTRAP_SCRIPTS_S3_KEY='${BootstrapScriptsS3Key}'
          export BOOTSTRAP_SCRIPTS_URL='${BootstrapScriptsUrl}'
          export SPLUNK_ADMIN_USER='${SplunkAdminUser}'
          export SPLUNK_ADMIN_PASSWORD='${SplunkAdminPassword}'
          export SPLUNK_MLTK_GPU_IMAGE='${SplunkMltkGpuImage}'
          export SPLUNK_LLM_RAG_IMAGE='${SplunkLlmRagImage}'
          export SPLUNK_LLM_RAG_HOST_PORT='${SplunkLlmRagHostPort}'
          export SPLUNK_MLTK_GPU_HOST_PORT='${SplunkMltkGpuHostPort}'
          export MLTK_CONTAINER_EXTERNAL_HOST='${MltkContainerExternalHost}'
          export DSDL_DOCKER_HOST='${DsdlDockerHost}'
          export DSDL_ENDPOINT_URL='${DsdlEndpointUrl}'
          export DSDL_EXTERNAL_URL='${DsdlExternalUrl}'
          export DSDL_DOCKER_NETWORK='${DsdlDockerNetwork}'
          export DSDL_CPU_INFERENCE_IMAGE='${DsdlCpuInferenceImage}'
          export DSDL_CPU_INFERENCE_PORT='${DsdlCpuInferencePort}'
          export AI_ARTIFACTS_BUCKET='${AiArtifactsBucket}'
          export OLLAMA_MODEL_S3_PREFIX='${OllamaModelS3Prefix}'
          export OLLAMA_MODELS_JSON='${OllamaModelsJson}'
          export SPLUNK_APP_S3_KEYS='${SplunkAppS3Keys}'
          export SPLUNK_APPS_S3_PREFIX='${SplunkAppsS3Prefix}'
          export RAG_MODEL_NAME='${RagModelName}'
          export CREATE_SNAPSHOT_ON_SUCCESS='${CreateSnapshotOnSuccess}'
          export REQUIRE_BOOTSTRAP_SUCCESS='${RequireBootstrapSuccess}'
          export SKIP_SPLUNK_APPS_BOOTSTRAP='${SkipSplunkAppsBootstrap}'

          CFN_STACK_NAME='${AWS::StackName}'
          CFN_REGION='${AWS::Region}'

          mkdir -p /opt/splunk-ai
          cat >/opt/splunk-ai/bootstrap.env <<'ENVVARS'
          export LICENSE_BUCKET='${LicenseBucket}'
          export LICENSE_KEY='${LicenseKey}'
          export LICENSES_S3_PREFIX='${LicenseS3Prefix}'
          export SPLUNK_PACKAGE_URL='${SplunkPackageUrl}'
          export SPLUNK_PACKAGE_S3_KEY='${SplunkPackageS3Key}'
          export SPLUNK_PACKAGE_S3_PREFIX='${SplunkPackageS3Prefix}'
          export CONTAINER_IMAGE_PROFILES_JSON='${ContainerImageProfilesJson}'
          export CFN_ARTIFACT_BUCKET='${CfnArtifactBucket}'
          export BOOTSTRAP_SCRIPTS_S3_KEY='${BootstrapScriptsS3Key}'
          export BOOTSTRAP_SCRIPTS_URL='${BootstrapScriptsUrl}'
          export SPLUNK_ADMIN_USER='${SplunkAdminUser}'
          export SPLUNK_ADMIN_PASSWORD='${SplunkAdminPassword}'
          export SPLUNK_MLTK_GPU_IMAGE='${SplunkMltkGpuImage}'
          export SPLUNK_LLM_RAG_IMAGE='${SplunkLlmRagImage}'
          export SPLUNK_LLM_RAG_HOST_PORT='${SplunkLlmRagHostPort}'
          export SPLUNK_MLTK_GPU_HOST_PORT='${SplunkMltkGpuHostPort}'
          export MLTK_CONTAINER_EXTERNAL_HOST='${MltkContainerExternalHost}'
          export DSDL_DOCKER_HOST='${DsdlDockerHost}'
          export DSDL_ENDPOINT_URL='${DsdlEndpointUrl}'
          export DSDL_EXTERNAL_URL='${DsdlExternalUrl}'
          export DSDL_DOCKER_NETWORK='${DsdlDockerNetwork}'
          export DSDL_CPU_INFERENCE_IMAGE='${DsdlCpuInferenceImage}'
          export DSDL_CPU_INFERENCE_PORT='${DsdlCpuInferencePort}'
          export AI_ARTIFACTS_BUCKET='${AiArtifactsBucket}'
          export OLLAMA_MODEL_S3_PREFIX='${OllamaModelS3Prefix}'
          export OLLAMA_MODELS_JSON='${OllamaModelsJson}'
          export SPLUNK_APP_S3_KEYS='${SplunkAppS3Keys}'
          export SPLUNK_APPS_S3_PREFIX='${SplunkAppsS3Prefix}'
          export RAG_MODEL_NAME='${RagModelName}'
          export CREATE_SNAPSHOT_ON_SUCCESS='${CreateSnapshotOnSuccess}'
          export REQUIRE_BOOTSTRAP_SUCCESS='${RequireBootstrapSuccess}'
          export SKIP_SPLUNK_APPS_BOOTSTRAP='${SkipSplunkAppsBootstrap}'
          export CFN_STACK_NAME='${AWS::StackName}'
          export CFN_REGION='${AWS::Region}'
          ENVVARS
          chmod 600 /opt/splunk-ai/bootstrap.env

          if ! aws s3 cp "s3://${CfnArtifactBucket}/${BootstrapScriptsS3Key}" /tmp/splunk-ai-scripts.tar.gz --region "${AWS::Region}"; then
            echo "WARNING: Failed to download bootstrap scripts via instance IAM from s3://${CfnArtifactBucket}/${BootstrapScriptsS3Key}; falling back to presigned URL"
            curl -fL '${BootstrapScriptsUrl}' -o /tmp/splunk-ai-scripts.tar.gz
          fi
          tar -tzf /tmp/splunk-ai-scripts.tar.gz | grep -q '^scripts/configure-splunk-apps.yml$'
          tar -xzf /tmp/splunk-ai-scripts.tar.gz -C /opt/splunk-ai

          test -f /opt/splunk-ai/scripts/configure-splunk-apps.yml

          chmod +x /opt/splunk-ai/scripts/*.sh

          INSTANCE_ID="$(curl -s http://169.254.169.254/latest/meta-data/instance-id || true)"
          if [[ -z "$INSTANCE_ID" ]]; then
            INSTANCE_ID="bootstrap"
          fi
          if /opt/splunk-ai/scripts/bootstrap.sh; then
            aws cloudformation signal-resource \
              --stack-name "$CFN_STACK_NAME" \
              --logical-resource-id SplunkAiInstance \
              --unique-id "$INSTANCE_ID" \
              --status SUCCESS \
              --region "$CFN_REGION"
            exit 0
          else
            BOOTSTRAP_EXIT=$?
            if [[ "$REQUIRE_BOOTSTRAP_SUCCESS" == "false" ]]; then
              echo "bootstrap.sh exited with $BOOTSTRAP_EXIT but signaling SUCCESS because REQUIRE_BOOTSTRAP_SUCCESS=false"
              aws cloudformation signal-resource \
                --stack-name "$CFN_STACK_NAME" \
                --logical-resource-id SplunkAiInstance \
                --unique-id "$INSTANCE_ID" \
                --status SUCCESS \
                --region "$CFN_REGION"
              exit 0
            fi
            aws cloudformation signal-resource \
              --stack-name "$CFN_STACK_NAME" \
              --logical-resource-id SplunkAiInstance \
              --unique-id "$INSTANCE_ID" \
              --status FAILURE \
              --region "$CFN_REGION"
            exit "$BOOTSTRAP_EXIT"
          fi

  SplunkAiElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc

  SplunkAiEipAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt SplunkAiElasticIp.AllocationId
      InstanceId: !Ref SplunkAiInstance

Outputs:
  InstanceId:
    Value: !Ref SplunkAiInstance
  ElasticIp:
    Value: !Ref SplunkAiElasticIp
