AWSTemplateFormatVersion: '2010-09-09'
Description: >
  GPU host (g4dn.4xlarge): Splunk Enterprise plus the full Dockerized AI stack
  (Ollama + both LLMs, Milvus/MinIO/etcd, DSDL/MLTK containers). Bootstrapped from
  an S3-staged script tarball via cloud-init.

Parameters:
  EnvironmentName:
    Type: String
  AmiId:
    Type: AWS::EC2::Image::Id
  InstanceType:
    Type: String
    Default: g4dn.4xlarge
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
  SubnetId:
    Type: AWS::EC2::Subnet::Id
  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  InstanceProfileName:
    Type: String
  RootVolumeSize:
    Type: Number
    Default: 150
  Airgapped:
    Type: String
    Default: 'false'
  AppsLicenseBucket:
    Type: String
  AiArtifactsBucket:
    Type: String
  EcrRegistryUri:
    Type: String
  EcrRepositoryName:
    Type: String
  BootstrapScriptsS3Key:
    Type: String
  BootstrapScriptsUrl:
    Type: String
  SecretsManagerSecretId:
    Type: String
  SplunkAdminUser:
    Type: String
    Default: admin
  # Splunk package + license + apps
  SplunkPackageUrl:
    Type: String
    Default: ''
  SplunkPackageS3Key:
    Type: String
    Default: ''
  SplunkPackageS3Prefix:
    Type: String
    Default: splunk-rpms/
  LicenseKey:
    Type: String
    Default: ''
  LicenseS3Prefix:
    Type: String
    Default: licenses/
  SplunkAppS3Keys:
    Type: String
    Default: ''
  SplunkAppsS3Prefix:
    Type: String
    Default: splunk-apps/
  SkipSplunkAppsBootstrap:
    Type: String
    Default: 'false'
  # Models
  OllamaModelsJson:
    Type: String
    Default: ''
  OllamaModelS3Prefix:
    Type: String
    Default: models/huggingface/ollama/
  RagModelName:
    Type: String
    Default: llama3.1:8b
  # Container image profiles / DSDL wiring
  ContainerImageProfilesJson:
    Type: String
    Default: ''
  SplunkMltkGpuImage:
    Type: String
    Default: ''
  SplunkLlmRagImage:
    Type: String
    Default: ''
  SplunkLlmRagHostPort:
    Type: Number
    Default: 5001
  SplunkMltkGpuHostPort:
    Type: Number
    Default: 5003
  DsdlCpuInferenceImage:
    Type: String
    Default: ''
  DsdlCpuInferencePort:
    Type: Number
    Default: 5002
  DsdlDockerNetwork:
    Type: String
    Default: dsenv-network
  # Airgap image overrides (ECR URIs) for infra containers
  OllamaImage:
    Type: String
    Default: ollama/ollama:latest
  EtcdImage:
    Type: String
    Default: quay.io/coreos/etcd:v3.5.12
  MinioImage:
    Type: String
    Default: minio/minio:RELEASE.2024-06-11T03-13-30Z
  MilvusImage:
    Type: String
    Default: milvusdb/milvus:v2.4.8
  NvidiaTestImage:
    Type: String
    Default: nvidia/cuda:12.4.1-base-ubuntu22.04
  CreateSnapshotOnSuccess:
    Type: String
    Default: 'true'
  RequireBootstrapSuccess:
    Type: String
    Default: 'true'
  AutoPullDsdlContainers:
    Type: String
    Default: 'false'
    Description: When false, deployment does not pull/start the DSDL gpu/llm_rag/cpu containers; the user starts them manually.
  DeployVllm:
    Type: String
    Default: 'true'
  DeployTokenMeterProxy:
    Type: String
    Default: 'false'
    Description: When true, deployment starts the token-metering proxies and points Splunk at them (token counting on).
  VllmImage:
    Type: String
    Default: vllm/vllm-openai:latest
  VllmModel:
    Type: String
    Default: ibm-granite/granite-3.1-2b-instruct
  VllmModelName:
    Type: String
    Default: granite-3.1-2b-instruct
  VllmModelS3Prefix:
    Type: String
    Default: models/vllm/granite-3.1-2b-instruct/
  TokenMeterProxyImage:
    Type: String
    Default: token-meter-proxy:latest
  TokenMetricsIndex:
    Type: String
    Default: token_metrics
  TokenMeterRoutesJson:
    Type: String
    Default: '[]'
  TokenMeterDefaultRole:
    Type: String
    Default: search-head

Resources:
  GpuInstance:
    Type: AWS::EC2::Instance
    CreationPolicy:
      ResourceSignal:
        Count: 1
        Timeout: PT180M
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      IamInstanceProfile: !Ref InstanceProfileName
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !Ref SecurityGroupId
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeType: gp3
            VolumeSize: !Ref RootVolumeSize
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-splunk-ai-gpu'
        - Key: SplunkAiRole
          Value: gpu-host
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          exec > >(tee -a /var/log/splunk-ai-userdata.log) 2>&1

          CFN_STACK_NAME='${AWS::StackName}'
          CFN_REGION='${AWS::Region}'

          mkdir -p /opt/splunk-ai
          cat >/opt/splunk-ai/bootstrap.env <<'ENVVARS'
          export AIRGAPPED='${Airgapped}'
          export CFN_STACK_NAME='${AWS::StackName}'
          export CFN_REGION='${AWS::Region}'
          export AWS_REGION='${AWS::Region}'
          export SECRETS_MANAGER_SECRET_ID='${SecretsManagerSecretId}'
          export SPLUNK_ADMIN_USER='${SplunkAdminUser}'
          export LICENSE_BUCKET='${AppsLicenseBucket}'
          export CFN_ARTIFACT_BUCKET='${AppsLicenseBucket}'
          export AI_ARTIFACTS_BUCKET='${AiArtifactsBucket}'
          export ECR_REGISTRY_URI='${EcrRegistryUri}'
          export ECR_REPOSITORY_NAME='${EcrRepositoryName}'
          export SPLUNK_PACKAGE_URL='${SplunkPackageUrl}'
          export SPLUNK_PACKAGE_S3_KEY='${SplunkPackageS3Key}'
          export SPLUNK_PACKAGE_S3_PREFIX='${SplunkPackageS3Prefix}'
          export LICENSE_KEY='${LicenseKey}'
          export LICENSES_S3_PREFIX='${LicenseS3Prefix}'
          export SPLUNK_APP_S3_KEYS='${SplunkAppS3Keys}'
          export SPLUNK_APPS_S3_PREFIX='${SplunkAppsS3Prefix}'
          export SKIP_SPLUNK_APPS_BOOTSTRAP='${SkipSplunkAppsBootstrap}'
          export OLLAMA_MODELS_JSON='${OllamaModelsJson}'
          export OLLAMA_MODEL_S3_PREFIX='${OllamaModelS3Prefix}'
          export RAG_MODEL_NAME='${RagModelName}'
          export CONTAINER_IMAGE_PROFILES_JSON='${ContainerImageProfilesJson}'
          export SPLUNK_MLTK_GPU_IMAGE='${SplunkMltkGpuImage}'
          export SPLUNK_LLM_RAG_IMAGE='${SplunkLlmRagImage}'
          export SPLUNK_LLM_RAG_HOST_PORT='${SplunkLlmRagHostPort}'
          export SPLUNK_MLTK_GPU_HOST_PORT='${SplunkMltkGpuHostPort}'
          export DSDL_CPU_INFERENCE_IMAGE='${DsdlCpuInferenceImage}'
          export DSDL_CPU_INFERENCE_PORT='${DsdlCpuInferencePort}'
          export DSDL_DOCKER_NETWORK='${DsdlDockerNetwork}'
          export MLTK_CONTAINER_EXTERNAL_HOST='127.0.0.1'
          export DSDL_DOCKER_HOST='tcp://127.0.0.1:2375'
          export DSDL_ENDPOINT_URL='https://127.0.0.1:2375'
          export DSDL_EXTERNAL_URL='https://127.0.0.1:2375'
          export OLLAMA_IMAGE='${OllamaImage}'
          export ETCD_IMAGE='${EtcdImage}'
          export MINIO_IMAGE='${MinioImage}'
          export MILVUS_IMAGE='${MilvusImage}'
          export NVIDIA_TEST_IMAGE='${NvidiaTestImage}'
          export CREATE_SNAPSHOT_ON_SUCCESS='${CreateSnapshotOnSuccess}'
          export REQUIRE_BOOTSTRAP_SUCCESS='${RequireBootstrapSuccess}'
          export AUTO_PULL_DSDL_CONTAINERS='${AutoPullDsdlContainers}'
          export DEPLOY_VLLM='${DeployVllm}'
          export DEPLOY_TOKEN_METER_PROXY='${DeployTokenMeterProxy}'
          export ENVIRONMENT_NAME='${EnvironmentName}'
          export TOKEN_METER_ROUTES='${TokenMeterRoutesJson}'
          export TOKEN_METER_DEFAULT_ROLE='${TokenMeterDefaultRole}'
          export VLLM_IMAGE='${VllmImage}'
          export VLLM_MODEL='${VllmModel}'
          export VLLM_MODEL_NAME='${VllmModelName}'
          export VLLM_MODEL_S3_PREFIX='${VllmModelS3Prefix}'
          export TOKEN_METER_PROXY_IMAGE='${TokenMeterProxyImage}'
          export TOKEN_METRICS_INDEX='${TokenMetricsIndex}'
          ENVVARS
          chmod 600 /opt/splunk-ai/bootstrap.env

          if ! aws s3 cp "s3://${AppsLicenseBucket}/${BootstrapScriptsS3Key}" /tmp/splunk-ai-scripts.tar.gz --region "${AWS::Region}"; then
            echo "WARNING: S3 download of bootstrap scripts failed; falling back to presigned URL"
            curl -fL '${BootstrapScriptsUrl}' -o /tmp/splunk-ai-scripts.tar.gz
          fi
          tar --warning=no-unknown-keyword -xzf /tmp/splunk-ai-scripts.tar.gz -C /opt/splunk-ai
          test -f /opt/splunk-ai/scripts/bootstrap-gpu.sh
          test -f /opt/splunk-ai/scripts/configure-splunk-apps.yml
          chmod +x /opt/splunk-ai/scripts/*.sh

          INSTANCE_ID="$(curl -s http://169.254.169.254/latest/meta-data/instance-id || true)"
          [[ -n "$INSTANCE_ID" ]] || INSTANCE_ID="bootstrap"

          source /opt/splunk-ai/bootstrap.env
          if /opt/splunk-ai/scripts/bootstrap-gpu.sh; then
            aws cloudformation signal-resource --stack-name "$CFN_STACK_NAME" \
              --logical-resource-id GpuInstance --unique-id "$INSTANCE_ID" \
              --status SUCCESS --region "$CFN_REGION"
            exit 0
          else
            BOOTSTRAP_EXIT=$?
            if [[ "$REQUIRE_BOOTSTRAP_SUCCESS" == "false" ]]; then
              echo "bootstrap-gpu.sh exited $BOOTSTRAP_EXIT but signaling SUCCESS (REQUIRE_BOOTSTRAP_SUCCESS=false)"
              aws cloudformation signal-resource --stack-name "$CFN_STACK_NAME" \
                --logical-resource-id GpuInstance --unique-id "$INSTANCE_ID" \
                --status SUCCESS --region "$CFN_REGION"
              exit 0
            fi
            aws cloudformation signal-resource --stack-name "$CFN_STACK_NAME" \
              --logical-resource-id GpuInstance --unique-id "$INSTANCE_ID" \
              --status FAILURE --region "$CFN_REGION"
            exit "$BOOTSTRAP_EXIT"
          fi

  ElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc

  ElasticIpAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt ElasticIp.AllocationId
      InstanceId: !Ref GpuInstance

Outputs:
  InstanceId:
    Value: !Ref GpuInstance
  PrivateIp:
    Value: !GetAtt GpuInstance.PrivateIp
  ElasticIp:
    Value: !Ref ElasticIp
