AWSTemplateFormatVersion: '2010-09-09'
Description: Optional shared infrastructure for S3 buckets and ECR repositories.

Parameters:
  EnvironmentName:
    Type: String
  SharedResourceNamePrefix:
    Type: String
    Default: ai-splunk-shared
    AllowedPattern: '^[a-z0-9][a-z0-9-]*[a-z0-9]$'
    ConstraintDescription: must be lowercase alphanumeric or hyphens and start and end with an alphanumeric character
  LicenseBucketName:
    Type: String
    Default: ''
  AiArtifactsBucketName:
    Type: String
    Default: ''
  ProvisionS3Buckets:
    Type: String
    Default: 'true'
  ProvisionEcrRepositories:
    Type: String
    Default: 'true'

Conditions:
  ShouldProvisionS3Buckets: !Equals [!Ref ProvisionS3Buckets, 'true']
  ShouldProvisionEcrRepositories: !Equals [!Ref ProvisionEcrRepositories, 'true']
Resources:
  RandomSuffixRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  RandomSuffixFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt RandomSuffixRole.Arn
      Timeout: 30
      Code:
        ZipFile: |
          import json
          import random
          import re
          import string
          import urllib.request

          def _send(event, context, status, data, physical_id):
              body = json.dumps({
                  "Status": status,
                  "Reason": f"See CloudWatch Logs for details: {context.log_stream_name}",
                  "PhysicalResourceId": physical_id or context.log_stream_name,
                  "StackId": event["StackId"],
                  "RequestId": event["RequestId"],
                  "LogicalResourceId": event["LogicalResourceId"],
                  "Data": data,
              }).encode("utf-8")
              req = urllib.request.Request(event["ResponseURL"], data=body, method="PUT")
              req.add_header("content-type", "")
              req.add_header("content-length", str(len(body)))
              with urllib.request.urlopen(req) as response:
                  response.read()

          def handler(event, context):
              if event["RequestType"] == "Delete":
                  _send(event, context, "SUCCESS", {"RandomSuffix": event.get("PhysicalResourceId", "")}, event.get("PhysicalResourceId", context.log_stream_name))
                  return

              raw_prefix = event.get("ResourceProperties", {}).get("SharedResourceNamePrefix", "")
              normalized = "".join(ch for ch in str(raw_prefix).lower() if (ch.isalnum() or ch == "-"))
              normalized = normalized.strip("-")

              if not normalized or not re.match(r"^[a-z0-9][a-z0-9-]*[a-z0-9]$", normalized):
                  raise ValueError(
                      "SharedResourceNamePrefix must contain lowercase letters, numbers, or hyphens, "
                      "and start/end with an alphanumeric character after normalization"
                  )

              suffix = "".join(random.choices(string.ascii_lowercase + string.digits, k=5))
              physical_id = f"{normalized}-{suffix}"
              _send(event, context, "SUCCESS", {"RandomSuffix": suffix, "SanitizedPrefix": normalized}, physical_id)

  RandomSuffix:
    Type: Custom::RandomSuffix
    Properties:
      ServiceToken: !GetAtt RandomSuffixFunction.Arn
      SharedResourceNamePrefix: !Ref SharedResourceNamePrefix

  LicenseBucket:
    Type: AWS::S3::Bucket
    Condition: ShouldProvisionS3Buckets
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub '${RandomSuffix.SanitizedPrefix}-license-bucket-${RandomSuffix.RandomSuffix}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  AiArtifactsBucket:
    Type: AWS::S3::Bucket
    Condition: ShouldProvisionS3Buckets
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub '${RandomSuffix.SanitizedPrefix}-ai-artifacts-bucket-${RandomSuffix.RandomSuffix}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  SharedContainerRepository:
    Type: AWS::ECR::Repository
    Condition: ShouldProvisionEcrRepositories
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: !Sub '${RandomSuffix.SanitizedPrefix}-shared-containers-${RandomSuffix.RandomSuffix}'
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256

Outputs:
  LicenseBucketName:
    Description: Provisioned S3 bucket name for licenses and app tarballs
    Value: !If [ShouldProvisionS3Buckets, !Ref LicenseBucket, !Ref LicenseBucketName]

  AiArtifactsBucketName:
    Description: Provisioned S3 bucket name for shared AI runtime artifacts
    Value: !If [ShouldProvisionS3Buckets, !Ref AiArtifactsBucket, !Ref AiArtifactsBucketName]

  EcrRegistryUri:
    Description: ECR registry URI
    Value: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com'

  MltkGpuRepositoryUri:
    Description: Shared ECR repository URI used for MLTK GPU image tag
    Value: !If [ShouldProvisionEcrRepositories, !GetAtt SharedContainerRepository.RepositoryUri, '']

  LlmRagRepositoryUri:
    Description: Shared ECR repository URI used for LLM RAG image tag
    Value: !If [ShouldProvisionEcrRepositories, !GetAtt SharedContainerRepository.RepositoryUri, '']