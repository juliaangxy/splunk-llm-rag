name: Validate CloudFormation

on:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}

      - name: Validate templates
        run: |
          aws cloudformation validate-template --template-body file://cloudformation/main.yaml
          aws cloudformation validate-template --template-body file://cloudformation/network.yaml
          aws cloudformation validate-template --template-body file://cloudformation/security.yaml
          aws cloudformation validate-template --template-body file://cloudformation/iam.yaml
          aws cloudformation validate-template --template-body file://cloudformation/gpu-instance.yaml
          aws cloudformation validate-template --template-body file://cloudformation/outputs.yaml
